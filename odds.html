<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odds Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/odds.css" />
  <link rel="stylesheet" href="css/calculators.css" />
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <div>
      <div class="logo">⚡ OddsDash</div>
      <p>Análise de odds · Arbitragem · Valor ELO</p>
    </div>
    <div class="header-right">
      <button id="refresh-btn" class="btn btn-green">↺ Atualizar</button>
      <span id="last-update" style="font-size:12px;color:var(--muted)"></span>
    </div>
  </header>

  <!-- Main nav -->
  <nav class="main-nav">
    <a href="odds.html" class="nav-tab active">📊 Odds</a>
    <a href="hedging.html" class="nav-tab">🛡️ Hedging</a>
    <a href="arbitrage.html" class="nav-tab">⚖️ Arbitragem</a>
  </nav>

  <!-- Error banner -->
  <div id="error-banner" class="error-banner" style="display:none"></div>

  <!-- ══════════════ ODDS PANEL ══════════════ -->
  <div id="panel-odds" class="panel active"></div>

</div><!-- /app -->

<!-- ── Betting Details Modal ── -->
<div id="betting-modal" class="betting-modal-overlay" style="display:none">
  <div class="betting-modal">
    <div class="betting-modal-header">
      <div>
        <div class="betting-modal-title" id="betting-modal-game">—</div>
        <div class="betting-modal-subtitle" id="betting-modal-info">—</div>
      </div>
      <button class="betting-modal-close" id="betting-modal-close">✕</button>
    </div>

    <div class="bm-select-wrap">
      <label class="bm-select-label">Casa de Apostas</label>
      <select id="modal-bm-select" class="bm-select" onchange="onBmSelectChange()"></select>
    </div>

    <div id="betting-value-badge"></div>

    <div class="bet-type-grid">
      <div id="btc-home" class="bet-type-card" onclick="selectBetType('home')" style="cursor:pointer">
        <div class="bet-type-label">1 Casa</div>
        <div class="bet-type-odd bet-type-odd-home" id="bto-home">—</div>
        <div class="bet-type-team" id="btt-home">—</div>
      </div>
      <div id="btc-draw" class="bet-type-card" onclick="selectBetType('draw')" style="cursor:pointer">
        <div class="bet-type-label">X Empate</div>
        <div class="bet-type-odd bet-type-odd-draw" id="bto-draw">—</div>
        <div class="bet-type-team">Empate</div>
      </div>
      <div id="btc-away" class="bet-type-card" onclick="selectBetType('away')" style="cursor:pointer">
        <div class="bet-type-label">2 Fora</div>
        <div class="bet-type-odd bet-type-odd-away" id="bto-away">—</div>
        <div class="bet-type-team" id="btt-away">—</div>
      </div>
    </div>

    <div class="betting-stake-input-wrap">
      <label class="betting-stake-label">Quanto quer apostar? (€)</label>
      <div class="stake-row">
        <input class="betting-stake-input" id="betting-stake-input" type="number" placeholder="100" min="1" step="1" value="100" oninput="updateBettingCalc()">
      </div>
      <div style="display:flex;gap:4px;margin-top:6px">
        <button class="stake-quick" onclick="setStake(10)">€10</button>
        <button class="stake-quick" onclick="setStake(25)">€25</button>
        <button class="stake-quick" onclick="setStake(50)">€50</button>
        <button class="stake-quick" onclick="setStake(100)">€100</button>
        <button class="stake-quick" onclick="setStake(250)">€250</button>
        <button class="stake-quick" onclick="setStake(500)">€500</button>
      </div>
    </div>

    <div class="betting-calculation">
      <div class="betting-calc-row">
        <span class="betting-calc-label">Tipo de aposta:</span>
        <span class="betting-calc-value" id="br-type">—</span>
      </div>
      <div class="betting-calc-row">
        <span class="betting-calc-label">Odd:</span>
        <span class="betting-calc-value" id="br-odd">—</span>
      </div>
      <div class="betting-calc-row">
        <span class="betting-calc-label">Aposta:</span>
        <span class="betting-calc-value" id="br-stake">—</span>
      </div>
      <div class="betting-calc-row">
        <span class="betting-calc-label">Retorno potencial:</span>
        <span class="betting-calc-value" id="br-return">—</span>
      </div>
      <div class="betting-calc-row">
        <span class="betting-calc-label">Lucro potencial:</span>
        <span class="betting-calc-value" id="br-profit">—</span>
      </div>
    </div>

    <div class="betting-buttons">
      <button class="betting-btn-main" id="betting-btn-copy" onclick="copyBettingInfo()">📋 Copiar aposta</button>
      <button class="betting-btn-close" id="betting-btn-close-modal" onclick="closeBettingModal()">Fechar</button>
    </div>
  </div>
</div>

<!-- ── History modal ── -->
<div id="history-modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-game-title">—</div>
        <div style="font-size:12px;color:var(--muted);margin-top:2px" id="modal-game-date">—</div>
      </div>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div class="history-bm-tabs" id="modal-bm-tabs"></div>
    <div class="chart-container">
      <canvas id="history-canvas"></canvas>
    </div>
    <div id="elo-modal-section"></div>
    <div id="modal-stats" style="margin-top:1rem"></div>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/odds.js"></script>
</body>
</html>
